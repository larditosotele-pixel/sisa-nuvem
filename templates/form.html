<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>{{ acao }} Convivente - SISA</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: Arial, sans-serif; background: #f5f5f5; padding: 20px; }
      .container { max-width: 600px; margin: 0 auto; background: white; padding: 30px; border-radius: 8px; }
        h1 { margin-bottom: 20px; color: #1b5e20; }
      .form-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; font-weight: bold; }
        input[type="text"], input[type="number"] { width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 5px; }
      .btn { background: #43a047; color: white; padding: 12px 20px; border: none; border-radius: 5px; cursor: pointer; font-size: 16px; }
      .btn-voltar { background: #95a5a6; text-decoration: none; display: inline-block; margin-left: 10px; }
    </style>
</head>
<body>
    <div class="container">
        <h1>{{ acao }} Convivente</h1>
        <form method="POST" enctype="multipart/form-data">
            <div class="form-group">
                <label for="nome">Nome Completo:</label>
                <input type="text" id="nome" name="nome" value="{{ convivente.nome if convivente else '' }}" required>
            </div>
            <div class="form-group">
                <label for="quarto">Quarto:</label>
                <input type="number" id="quarto" name="quarto" value="{{ convivente.quarto if convivente else '0' }}" required>
            </div>
            <div class="form-group">
                <label for="leito">Leito:</label>
                <input type="number" id="leito" name="leito" value="{{ convivente.leito if convivente else '0' }}" required>
            </div>
            <div class="form-group">
                <label for="foto">Foto:</label>
                <input type="file" id="foto" name="foto" accept="image/*">
            </div>
            <button type="submit" class="btn">{{ acao }}</button>
            <a href="{{ url_for('listar') }}" class="btn btn-voltar">Cancelar</a>
        </form>
    </div>
</body>
</html>
