{% extends "base.html" %}

{% block title %}Cadastrar Convivente - SISA{% endblock %}

{% block content %}
<h2><i class="fas fa-user-plus"></i> Cadastrar Novo Convivente</h2>

<form method="POST" class="card" style="padding: 20px;">
    <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 16px;">
        <div style="grid-column: 1/-1;">
            <label>Foto do Convivente</label>
            <input type="file" id="foto_input" accept="image/*" style="margin-bottom: 10px;">
            <input type="hidden" name="foto_base64" id="foto_base64">
            <div id="preview_container" style="display: none;">
                <img id="preview" style="max-width: 200px; max-height: 200px; border-radius: 8px; border: 2px solid #e0e0e0;">
            </div>
        </div>

        <div>
            <label>Nome Completo *</label>
            <input type="text" name="nome" id="nome" required placeholder="Digite ou selecione a foto">
        </div>

        <div>
            <label>Data de Nascimento</label>
            <input type="date" name="data_nascimento">
        </div>

        <div>
            <label>Quarto *</label>
            <select name="quarto_id" id="quarto_select" required onchange="carregarLeitos()">
                <option value="">Selecione o Quarto</option>
                {% for q in quartos %}
                <option value="{{ q.id }}">Quarto {{ q.numero }}</option>
                {% endfor %}
            </select>
        </div>

        <div>
            <label>Leito *</label>
            <select name="leito_id" id="leito_select" required disabled>
                <option value="">Selecione o quarto primeiro</option>
            </select>
        </div>
    </div>

    <div style="margin-top: 24px;">
        <button type="submit" class="btn">
            <i class="fas fa-save"></i> Salvar Convivente
        </button>
        <a href="{{ url_for('lista_conviventes') }}" class="btn btn-voltar">
            <i class="fas fa-times"></i> Cancelar
        </a>
    </div>
</form>

<script>
// 1. Foto → base64 + nome automático
document.getElementById('foto_input').addEventListener('change', function(e) {
    let arquivo = e.target.files[0];
    if (arquivo) {
        const reader = new FileReader();
        reader.onload = function(event) {
            document.getElementById('foto_base64').value = event.target.result;
            document.getElementById('preview').src = event.target.result;
            document.getElementById('preview_container').style.display = 'block';
        };
        reader.readAsDataURL(arquivo);

        let nomeArquivo = arquivo.name.split('.')[0];
        nomeArquivo = nomeArquivo.replace(/_/g, ' ').replace(/-/g, ' ');
        nomeArquivo = nomeArquivo.toLowerCase().split(' ').map(word =>
            word.charAt(0).toUpperCase() + word.slice(1)
        ).join(' ');
        document.getElementById('nome').value = nomeArquivo;
    }
});

// 2. Carrega leitos vagos quando escolhe quarto
async function carregarLeitos() {
    const quartoId = document.getElementById('quarto_select').value;
    const leitoSelect = document.getElementById('leito_select');

    if (!quartoId) {
        leitoSelect.innerHTML = '<option value="">Selecione o quarto primeiro</option>';
        leitoSelect.disabled = true;
        return;
    }

    leitoSelect.innerHTML = '<option value="">Carregando...</option>';
    leitoSelect.disabled = true;

    const response = await fetch(`/api/leitos_vagos/${quartoId}`);
    const leitos = await response.json();

    if (leitos.length === 0) {
        leitoSelect.innerHTML = '<option value="">Nenhum leito vago neste quarto</option>';
    } else {
        leitoSelect.innerHTML = '<option value="">Selecione o Leito</option>';
        leitos.forEach(l => {
            leitoSelect.innerHTML += `<option value="${l.id}">Leito ${l.numero_leito}</option>`;
        });
        leitoSelect.disabled = false;
    }
}
</script>

<style>
@media (max-width: 768px) {
    div[style*="grid-template-columns"] {
        grid-template-columns: 1fr!important;
    }
}
</style>
{% endblock %}
