{% extends "base.html" %}

{% block title %}SISA - Cadastrar Convivente{% endblock %}

{% block content %}
<a href="{{ url_for('mapa_leitos') }}" class="btn btn-voltar"><i class="fas fa-arrow-left"></i> Voltar ao Mapa</a>

<h2><i class="fas fa-user-plus"></i> Cadastrar Novo Convivente</h2>

<form method="POST" enctype="multipart/form-data" id="formConvivente">
    <div style="margin-bottom: 16px;">
        <label><strong>Foto do Convivente:</strong></label><br>
        <input type="file" id="foto" name="foto" accept="image/*" onchange="previewImage(event)">
        <input type="hidden" name="foto_base64" id="foto_base64">
        <div id="preview" style="margin-top: 10px;"></div>
        <small id="tamanhoFoto" style="color: #666;"></small>
    </div>

    <div style="margin-bottom: 16px;">
        <label><strong>Nome Completo:</strong></label><br>
        <input type="text" name="nome" id="nome" required style="width: 100%; padding: 8px;">
    </div>

    <div style="margin-bottom: 16px;">
        <label><strong>Data de Nascimento:</strong></label><br>
        <input type="date" name="data_nascimento" style="padding: 8px;">
    </div>

    <div style="margin-bottom: 16px;">
        <label><strong>Quarto:</strong></label><br>
        <select name="quarto_id" id="quarto" required onchange="carregarLeitos()" style="width: 100%; padding: 8px;">
            <option value="">Selecione o Quarto</option>
            {% for quarto in quartos %}
                <option value="{{ quarto.id }}"
                    {% if quarto_pre_selecionado and quarto_pre_selecionado == quarto.id %}selected{% endif %}>
                    Quarto {{ quarto.numero }}
                </option>
            {% endfor %}
        </select>
    </div>

    <div style="margin-bottom: 16px;">
        <label><strong>Leito:</strong></label><br>
        <select name="leito_id" id="leito" required style="width: 100%; padding: 8px;">
            {% if leito_pre_selecionado %}
                <option value="{{ leito_pre_selecionado.id }}" selected>Leito {{ leito_pre_selecionado.numero_leito }}</option>
            {% else %}
                <option value="">Selecione o Quarto Primeiro</option>
            {% endif %}
        </select>
    </div>

    <button type="submit" class="btn" id="btnSalvar"><i class="fas fa-save"></i> Salvar Convivente</button>
</form>

<script>
// Comprime a imagem antes de enviar
function previewImage(event) {
    const file = event.target.files[0];
    if (!file) return;

    let fileName = file.name.replace(/\.[^/.]+$/, "");
    fileName = fileName.replace(/_/g, " ").replace(/-/g, " ");
    document.getElementById('nome').value = fileName;

    const reader = new FileReader();
    reader.onload = function(e) {
        const img = new Image();
        img.onload = function() {
            // Redimensiona pra no máximo 800x800
            const canvas = document.createElement('canvas');
            const ctx = canvas.getContext('2d');
            let width = img.width;
            let height = img.height;
            const maxSize = 800;

            if (width > height) {
                if (width > maxSize) {
                    height *= maxSize / width;
                    width = maxSize;
                }
            } else {
                if (height > maxSize) {
                    width *= maxSize / height;
                    height = maxSize;
                }
            }

            canvas.width = width;
            canvas.height = height;
            ctx.drawImage(img, 0, 0, width, height);

            // Comprime com 70% de qualidade
            const compressedBase64 = canvas.toDataURL('image/jpeg', 0.7);
            document.getElementById('preview').innerHTML = '<img src="' + compressedBase64 + '" style="max-width: 200px; border-radius: 8px;">';
            document.getElementById('foto_base64').value = compressedBase64;

            // Mostra o tamanho
            const sizeKB = Math.round(compressedBase64.length * 0.75 / 1024);
            document.getElementById('tamanhoFoto').innerText = `Foto comprimida: ${sizeKB}KB`;
        };
        img.src = e.target.result;
    };
    reader.readAsDataURL(file);
}

function carregarLeitos() {
    const quartoId = document.getElementById('quarto').value;
    const leitoSelect = document.getElementById('leito');

    if({{ 'true' if leito_pre_selecionado else 'false' }} && leitoSelect.options.length > 1) {
        return;
    }

    leitoSelect.innerHTML = '<option value="">Carregando...</option>';

    if (quartoId) {
        fetch('/api/leitos_vagos/' + quartoId)
     .then(response => response.json())
     .then(data => {
                leitoSelect.innerHTML = '<option value="">Selecione o Leito</option>';
                data.forEach(leito => {
                    leitoSelect.innerHTML += '<option value="' + leito.id + '">Leito ' + leito.numero_leito + '</option>';
                });
            });
    } else {
        leitoSelect.innerHTML = '<option value="">Selecione o Quarto Primeiro</option>';
    }
}

window.onload = function() {
    {% if not leito_pre_selecionado %}
    if(document.getElementById('quarto').value) carregarLeitos();
    {% endif %}
}

// Previne duplo clique
document.getElementById('formConvivente').onsubmit = function() {
    document.getElementById('btnSalvar').disabled = true;
    document.getElementById('btnSalvar').innerHTML = '<i class="fas fa-spinner fa-spin"></i> Salvando...';
};
</script>
{% endblock %}
