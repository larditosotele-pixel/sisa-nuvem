{% extends 'base.html' %}

{% block content %}
<div class="container">
    <h2>Fazer Chamada</h2>
    
    <form method="POST" action="{{ url_for('salvar_chamada') }}">
        <div class="form-group">
            <label>Período:</label>
            <select name="periodo" class="form-control" required>
                <option value="Manhã">Manhã</option>
                <option value="Tarde">Tarde</option>
                <option value="Noite">Noite</option>
            </select>
        </div>

        <table class="table">
            <thead>
                <tr>
                    <th>Foto</th>
                    <th>Nome</th>
                    <th>Quarto</th>
                    <th>Leito</th>
                    <th>Presente?</th>
                </tr>
            </thead>
            <tbody>
                {% for c in conviventes %}
                <tr>
                    <td>
                        {% if c.foto %}
                            <img src="{{ url_for('static', filename='fotos/' + c.foto) }}" width="50">
                        {% else %}
                            <img src="{{ url_for('static', filename='sem-foto.jpg') }}" width="50">
                        {% endif %}
                    </td>
                    <td>{{ c.nome }}</td>
                    <td>{{ c.quarto }}</td>
                    <td>{{ c.leito }}</td>
                    <td>
                        <input type="checkbox" name="presente_{{ c.id }}" checked>
                    </td>
                </tr>
                {% endfor %}
            </tbody>
        </table>

        <button type="submit" class="btn btn-success">Salvar Chamada</button>
        <a href="{{ url_for('index') }}" class="btn btn-secondary">Voltar</a>
    </form>
</div>
{% endblock %}
