<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Cadastrar Convivente</title>
    <style>
        body { font-family: Arial; background: #f0f0f0; margin: 0; }
       .header { background: #1b5e20; color: white; padding: 15px; text-align: center; }
       .container { max-width: 500px; margin: 30px auto; background: white; padding: 30px; border-radius: 8px; }
        input, select { width: 100%; padding: 10px; margin: 8px 0; border: 1px solid #ddd; border-radius: 4px; }
        button { background: #2e7d32; color: white; padding: 12px; border: none; border-radius: 4px; width: 100%; cursor: pointer; }
    </style>
</head>
<body>
    <div class="header"><h1>Cadastrar Convivente</h1></div>
    <div class="container">
        <form method="POST">
            <label>Foto (URL ou caminho):</label>
            <input type="text" name="foto" id="foto" oninput="pegarNome()">

            <label>Nome:</label>
            <input type="text" name="nome" id="nome" required>

            <label>Status:</label>
            <select name="status" required>
                <option value="Ativo">Ativo</option>
                <option value="Inativo">Inativo</option>
            </select>

            <button type="submit">Cadastrar</button>
        </form>
        <br><a href="{{ url_for('lista_conviventes') }}">← Voltar</a>
    </div>

    <script>
    function pegarNome() {
        let caminho = document.getElementById('foto').value;
        if (caminho) {
            // Pega só o nome do arquivo, sem extensão
            let nomeArquivo = caminho.split('/').pop().split('\\').pop();
            let nomeSemExt = nomeArquivo.split('.')[0];
            // Troca _ por espaço e deixa bonito
            let nomeFinal = nomeSemExt.replace(/_/g, ' ').replace(/-/g, ' ');
            document.getElementById('nome').value = nomeFinal;
        }
    }
    </script>
</body>
</html>
