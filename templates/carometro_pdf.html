<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <style>
        @page { 
            size: A4 portrait; 
            margin: 3mm; 
        }
        body { 
            margin: 0; 
            font-family: Arial; 
        }
      .grid {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            grid-template-rows: repeat(9, 1fr);
            gap: 1mm;
            height: 291mm;
            width: 100%;
        }
      .card {
            border: 0.2mm solid #000;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            page-break-inside: avoid;
        }
      .card-header {
            background: #4a90e2;
            color: white;
            font-size: 7pt;
            text-align: center;
            padding: 0.5mm;
            flex-shrink: 0;
        }
      .card-foto {
            flex: 1;
            min-height: 0;
            background: white; /* MUDEI: Fundo branco pra foto não ficar cortada */
            display: flex;
            align-items: center;
            justify-content: center;
        }
      .card-foto img {
            max-width: 100%;
            max-height: 100%;
            object-fit: contain; /* MUDEI: Mostra a foto inteira, sem cortar */
        }
      .card .sem-foto {
            background: #eee;
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 6pt;
        }
      .card-nome {
            font-size: 6pt;
            font-weight: bold;
            text-align: center;
            padding: 0.5mm;
            height: 6mm;
            flex-shrink: 0;
            background: #f8f9fa;
            overflow: hidden;
        }
      .card:nth-child(21n) { page-break-after: always; }
    </style>
</head>
<body>
    <div class="grid">
        {% for conv in conviventes %}
        <div class="card">
            <div class="card-header">Q{{ conv.quarto_numero }} L{{ conv.numero_leito }}</div>
            <div class="card-foto">
                {% if conv.foto_base64 %}
                    <img src="{{ conv.foto_base64 }}">
                {% else %}
                    <div class="sem-foto">S/Foto</div>
                {% endif %}
            </div>
            <div class="card-nome">{{ conv.nome }}</div>
        </div>
        {% endfor %}
    </div>
</body>
</html>
