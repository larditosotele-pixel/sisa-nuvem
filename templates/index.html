<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SISA - CAE Idoso - Lar Ditoso</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { 
            font-family: Arial, sans-serif; 
            background: #f5f5f5;
            min-height: 100vh;
        }

        /* NAVBAR VERDE - ADICIONADO */
       .navbar {
            background: #2e7d32;
            color: white;
            padding: 15px 30px;
            display: flex;
            align-items: center;
            gap: 15px;
        }
       .logo-img {
            width: 45px;
            height: 45px;
            background: white;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
            overflow: hidden;
        }
       .logo-img img { width: 35px; height: 35px; object-fit: contain; }
       .navbar-info h2 { font-size: 22px; margin: 0; }
       .navbar-info p { font-size: 11px; margin: 0; opacity: 0.9; }

        /* WRAPPER PRA CENTRALIZAR - ADICIONADO */
       .wrapper {
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 30px 20px;
            min-height: calc(100vh - 75px);
        }

        .container {
            background: white;
            padding: 40px;
            border-radius: 15px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            width: 90%;
            max-width: 400px;
            text-align: center;
        }
        .container h1 {
            color: #333;
            margin-bottom: 30px;
            font-size: 24px;
        }
        .btn-menu {
            display: block;
            width: 100%;
            padding: 15px;
            margin-bottom: 15px;
            background: #007bff;
            color: white;
            text-decoration: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            transition: background 0.2s;
        }
        .btn-menu:hover {
            background: #0056b3;
        }
        .btn-menu:last-child {
            margin-bottom: 0;
        }
    </style>
</head>
<body>
    <!-- BARRA VERDE COM LOGO - ADICIONADO -->
    <div class="navbar">
        <div class="logo-img">
            <img src="{{ url_for('static', filename='logo_ki.png') }}" alt="Logo Lar Ditoso">
        </div>
        <div class="navbar-info">
            <h2>SISA</h2>
            <p>Sistema Integrado de Saúde e Acompanhamento - CAE Idoso Lar Ditoso</p>
        </div>
    </div>

    <!-- WRAPPER PRA MANTER CENTRALIZADO - ADICIONADO -->
    <div class="wrapper">
        <div class="container">
            <h1>SISA</h1>
            <h1>CAE Idoso - Lar Ditoso</h1>
            
            <a href="{{ url_for('mapa_leitos') }}" class="btn-menu">
                📍 Mapa de Leitos
            </a>
            
            <a href="{{ url_for('chamada') }}" class="btn-menu">
                📋 Chamada Diária
            </a>
            
            <a href="{{ url_for('cadastrar_convivente') }}" class="btn-menu">
                ➕ Cadastrar Convivente
            </a>
            
            <a href="{{ url_for('relatorio_mensal') }}" class="btn-menu">
                📊 Relatório Mensal
            </a>

            <a href="{{ url_for('relatorio_branco') }}" class="btn-menu">
                📄 Relatório Mensal em Branco
            </a>
            
            <a href="{{ url_for('carometro') }}" class="btn-menu">
                👥 Carômetro
            </a>
        </div>
    </div>
</body>
</html>
