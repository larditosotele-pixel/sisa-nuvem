<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Carômetro - SISA</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: Arial, sans-serif;
            background: #f5f5f5;
            padding: 3px;
        }
     .header {
            background: white;
            padding: 8px;
            border-radius: 4px;
            margin-bottom: 5px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 5px;
        }
     .header h1 { font-size: 16px; }
     .botoes { display: flex; gap: 4px; flex-wrap: wrap; }
     .btn {
            padding: 5px 8px;
            border: 1px solid #007bff;
            background: white;
            color: #007bff;
            text-decoration: none;
            border-radius: 3px;
            font-size: 12px;
            font-weight: bold;
            cursor: pointer;
        }
     .btn.active { background: #007bff; color: white; }
     .btn-imprimir { background: #28a745; color: white; border-color: #28a745; }

     .container {
            background: white;
            padding: 2px;
            border-radius: 4px;
        }

     .grid {
            display: grid;
            grid-template-columns: repeat(10, 1fr);
            gap: 2px;
        }

     .card {
            border: 1px solid #000;
            background: white;
            display: flex;
            flex-direction: column;
        }
     .card-header {
            background: #4a90e2;
            color: white;
            font-size: 10px;
            font-weight: bold;
            text-align: center;
            padding: 2px 0;
            line-height: 1.1;
            white-space: nowrap;
        }
     .card-foto {
            padding: 1px;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #fff;
            height: 60px;
        }
     .card-foto img {
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
            border: 1px solid #ccc;
        }
     .sem-foto {
            width: 100%;
            height: 100%;
            border-radius: 4px;
            background: #e9ecef;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #6c757d;
            font-size: 8px;
            border: 1px solid #ccc;
        }
     .card-nome {
            font-size: 9px;
            font-weight: bold;
            text-align: center;
            padding: 2px 1px;
            line-height: 1.1;
            word-break: break-word;
            min-height: 24px;
            background: #f8f9fa;
        }

        @media (max-width: 768px) {
         .grid { grid-template-columns: repeat(5, 1fr); }
        }

        /* IMPRESSÃO - SEMPRE 3 FOLHAS PRA 100 LEITOS */
        @media print {
            @page {
                size: A4 landscape;
                margin: 4mm; /* MARGEM MÍNIMA PRA CABER 4 LINHAS */
            }
            body {
                background: white;
                padding: 0;
            }
         .header, .botoes {
                display: none;
            }
         .container {
                padding: 0;
                border-radius: 0;
            }
         .grid {
                display: grid;
                grid-template-columns: repeat(9, 1fr); /* 9 COLUNAS */
                grid-auto-rows: 44mm; /* ALTURA MENOR = 4 LINHAS CABEM = 36 POR FOLHA */
                gap: 1.5mm;
                page-break-inside: avoid;
            }
         .card {
                border: 0.5pt solid #000;
                page-break-inside: avoid;
                display: flex;
                flex-direction: column;
            }
         .card-header {
                background: #4a90e2 !important;
                -webkit-print-color-adjust: exact;
                print-color-adjust: exact;
                color: white;
                font-size: 7pt;
                font-weight: bold;
                text-align: center;
                padding: 0.5mm 0;
                height: 5mm;
                flex-shrink: 0;
            }
         .card-foto {
                padding: 0;
                flex: 1;
                display: flex;
                justify-content: center;
                align-items: center;
                background: #fff;
                min-height: 0;
            }
         .card-foto img {
                width: 100%;
                height: 100%;
                object-fit: cover; /* SEM ACHATAR */
                object-position: center 20%;
            }
         .sem-foto {
                width: 100%;
                height: 100%;
                background: #e9ecef;
                display: flex;
                align-items: center;
                justify-content: center;
                color: #6c757d;
                font-size: 6pt;
            }
         .card-nome {
                font-size: 7pt; /* NOME MAIOR */
                font-weight: bold;
                text-align: center;
                padding: 0.5mm;
                background: #f8f9fa !important;
                -webkit-print-color-adjust: exact;
                print-color-adjust: exact;
                height: 11mm;
                flex-shrink: 0;
                display: flex;
                align-items: center;
                justify-content: center;
                line-height: 1.1;
            }
        }
    </style>
</head>
<body>
    <div class="header">
        <h1>Carômetro - Conviventes | Total: {{ conviventes|length }} / 100</h1>
        <div class="botoes">
            <a href="{{ url_for('index') }}" class="btn">← Voltar</a>
            <a href="{{ url_for('carometro', ordem='quarto') }}" class="btn {% if ordem == 'quarto' %}active{% endif %}">Por Quarto</a>
            <a href="{{ url_for('carometro', ordem='alfabetica') }}" class="btn {% if ordem == 'alfabetica' %}active{% endif %}">A-Z</a>
            <button onclick="window.print()" class="btn btn-imprimir">🖨️ Imprimir / Salvar PDF - 3 Folhas</button>
        </div>
    </div>

    <div class="container">
        <div class="grid">
            {% for conv in conviventes %}
                <div class="card">
                    <div class="card-header">Q{{ conv.quarto_numero }} L{{ conv.numero_leito }}</div>
                    <div class="card-foto">
                        {% if conv.foto_base64 %}
                            <img src="{{ conv.foto_base64 }}" alt="{{ conv.nome }}">
                        {% else %}
                            <div class="sem-foto">S/Foto</div>
                        {% endif %}
                    </div>
                    <div class="card-nome">{{ conv.nome }}</div>
                </div>
            {% endfor %}
        </div>
    </div>
</body>
</html>
