<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Chamada Diária - SISA</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: Arial, sans-serif; background: #e0e0e0; }

     .header {
            background: #1b5e20;
            color: white;
            padding: 3mm 5mm;
            display: flex;
            align-items: center;
            gap: 3mm;
        }
     .header img { height: 10mm; width: 10mm; }
     .header-text h1 { margin: 0; font-size: 14pt; }
     .header-text span { font-size: 9pt; }

     .container { max-width: 900px; margin: 20px auto; background: white; padding: 15px; border-radius: 8px; }
     .header-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; }
     .header-bar h2 { color: #333; font-size: 18px; }
     .btn-fechar { background: #7f8c8d; color: white; padding: 8px 15px; border-radius: 4px; text-decoration: none; font-weight: bold; }
     .filtros { display: flex; gap: 5px; margin: 10px 0; }
     .btn-filtro { flex: 1; background: #3498db; color: white; border: none; padding: 10px; border-radius: 4px; font-weight: bold; cursor: pointer; }
     .btn-filtro.ativo { background: #1b5e20; }
     .resumo { display: flex; gap: 5px; margin: 10px 0; background: #34495e; color: white; padding: 8px; border-radius: 4px; }
     .resumo-item { flex: 1; text-align: center; font-weight: bold; }
     .data-input { width: 100%; padding: 8px; margin: 10px 0; border: 1px solid #ccc; border-radius: 4px; }
     .lista-convivente { border-bottom: 1px solid #eee; padding: 8px 0; display: flex; align-items: center; justify-content: space-between; }
     .info { display: flex; align-items: center; gap: 10px; }
     .info img { width: 35px; height: 35px; border-radius: 50%; object-fit: cover; }
     .info-nome { font-weight: bold; font-size: 14px; }
     .info-quarto { font-size: 11px; color: #666; }
     .botoes-status { display: flex; gap: 5px; }
     .btn-status { width: 30px; height: 30px; border: 1px solid #ccc; background: white; cursor: pointer; font-weight: bold; border-radius: 3px; }
     .btn-status.ativo-P { background: #2ecc71; color: white; border-color: #27ae60; }
     .btn-status.ativo-F { background: #e74c3c; color: white; border-color: #c0392b; }
     .btn-status.ativo-A { background: #f39c12; color: white; border-color: #d35400; }
     .btn-status.ativo-H { background: #3498db; color: white; border-color: #2980b9; }
     .salvar-fixo { position: fixed; bottom: 20px; right: 20px; background: #27ae60; color: white; border: none; padding: 15px 25px; border-radius: 50px; font-size: 16px; font-weight: bold; cursor: pointer; box-shadow: 0 4px 10px rgba(0,0,0,0.2); }
    </style>
</head>
<body>
    <div class="header">
        <img src="{{ url_for('static', filename='logo_ki.png') }}" alt="Logo">
        <div class="header-text">
            <h1>SISA</h1>
            <span>CAE Idoso Lar Ditoso</span>
        </div>
    </div>

    <div class="container">
        <div class="header-bar">
            <h2>CHAMADA DIÁRIA</h2>
            <a href="{{ url_for('index') }}" class="btn-fechar">X FECHAR</a>
        </div>

        <label>DATA DA CHAMADA:</label>
        <input type="date" id="data-chamada" class="data-input" value="{{ hoje }}">

        <div class="filtros">
            <button class="btn-filtro" onclick="ordenar('quarto')">ORDEM: QUARTO</button>
            <button class="btn-filtro" onclick="ordenar('nome')">ORDEM: A-Z</button>
        </div>

        <div class="resumo">
            <div class="resumo-item">P: <span id="total-p">0</span></div>
            <div class="resumo-item">F: <span id="total-f">0</span></div>
            <div class="resumo-item">A: <span id="total-a">0</span></div>
            <div class="resumo-item">H: <span id="total-h">0</span></div>
        </div>

        <div id="lista">
            {% for c in conviventes %}
            <div class="lista-convivente" data-id="{{ c.id }}" data-nome="{{ c.nome }}" data-quarto="{{ c.quarto }}">
                <div class="info">
                    {% if c.foto %}
                        <img src="{{ url_for('static', filename=c.foto) }}" onerror="this.src='{{ url_for('static', filename='sem-foto.jpg') }}'">
                    {% else %}
                        <img src="{{ url_for('static', filename='sem-foto.jpg') }}">
                    {% endif %}
                    <div>
                        <div class="info-nome">{{ c.nome }}</div>
                        <div class="info-quarto">Quarto {{ c.quarto }} - Leito {{ c.leito }}</div>
                    </div>
                </div>
                <div class="botoes-status">
                    <button class="btn-status" data-status="P" onclick="marcar(this)">P</button>
                    <button class="btn-status" data-status="F" onclick="marcar(this)">F</button>
                    <button class="btn-status" data-status="A" onclick="marcar(this)">A</button>
                    <button class="btn-status" data-status="H" onclick="marcar(this)">H</button>
                </div>
            </div>
            {% endfor %}
        </div>
    </div>

    <button class="salvar-fixo" onclick="salvarChamada()">SALVAR CHAMADA</button>

<script>
    const presencas = {};
    const chamadasSalvas = {{ chamadas_salvas | tojson }};
    document.querySelectorAll('.lista-convivente').forEach(item => {
        const id = item.dataset.id;
        if (chamadasSalvas[id]) {
            const status = chamadasSalvas[id];
            presencas[id] = status;
            const btn = item.querySelector(`.btn-status[data-status="${status}"]`);
            if (btn) btn.classList.add('ativo-' + status);
        }
    });
    atualizarResumo();

    function marcar(btn) {
        const item = btn.closest('.lista-convivente');
        const id = item.dataset.id;
        const status = btn.dataset.status;
        item.querySelectorAll('.btn-status').forEach(b => {
            b.classList.remove('ativo-P', 'ativo-F', 'ativo-A', 'ativo-H');
        });
        if (presencas[id] === status) {
            delete presencas[id];
        } else {
            btn.classList.add('ativo-' + status);
            presencas[id] = status;
        }
        atualizarResumo();
    }

    function atualizarResumo() {
        let p=0,f=0,a=0,h=0;
        for (const id in presencas) {
            if (presencas[id] === 'P') p++;
            if (presencas[id] === 'F') f++;
            if (presencas[id] === 'A') a++;
            if (presencas[id] === 'H') h++;
        }
        document.getElementById('total-p').innerText = p;
        document.getElementById('total-f').innerText = f;
        document.getElementById('total-a').innerText = a;
        document.getElementById('total-h').innerText = h;
    }

    function salvarChamada() {
        const data = document.getElementById('data-chamada').value;
        fetch('/salvar_chamada', {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({data: data, presencas: presencas})
        }).then(res => res.json()).then(data => {
            if (data.status === 'ok') alert('Chamada salva com sucesso!');
        });
    }

    function ordenar(tipo) {
        const lista = document.getElementById('lista');
        const itens = Array.from(lista.children);
        itens.sort((a, b) => {
            if (tipo === 'nome') return a.dataset.nome.localeCompare(b.dataset.nome);
            return parseInt(a.dataset.quarto) - parseInt(b.dataset.quarto);
        });
        itens.forEach(item => lista.appendChild(item));
        document.querySelectorAll('.btn-filtro').forEach(btn => btn.classList.remove('ativo'));
        event.target.classList.add('ativo');
    }

    document.getElementById('data-chamada').addEventListener('change', function() {
        window.location.href = '/chamada?data=' + this.value;
    });
</script>
</body>
</html>
