<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SISA - Menu Principal</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: Arial, sans-serif; background: #f5f5f5; }
        .navbar {
            background: #2e7d32;
            color: white;
            padding: 15px 30px;
            display: flex;
            align-items: center;
            gap: 15px;
        }
        .logo-img {
            width: 45px;
            height: 45px;
            background: white;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }
        .logo-img img { width: 35px; height: 35px; object-fit: contain; }
        .navbar-info h2 { font-size: 22px; margin: 0; }
        .navbar-info p { font-size: 11px; margin: 0; opacity: 0.9; }
        
        .container { max-width: 1200px; margin: 40px auto; padding: 0 20px; }
        .titulo { text-align: center; margin-bottom: 40px; color: #333; }
        .grid-menu {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
            gap: 20px;
        }
        .card-menu {
            background: white;
            padding: 30px 20px;
            border-radius: 10px;
            text-align: center;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
            text-decoration: none;
            color: #333;
            transition: transform 0.2s;
        }
        .card-menu:hover { transform: translateY(-5px); }
        .card-menu h3 { color: #2e7d32; margin-bottom: 10px; }
    </style>
</head>
<body>
    <div class="navbar">
        <div class="logo-img">
            <img src="{{ url_for('static', filename='logo_ki.png') }}" alt="Logo">
        </div>
        <div class="navbar-info">
            <h2>SISA</h2>
            <p>Sistema Integrado de Saúde e Acompanhamento - CAE Idoso Lar Ditoso</p>
        </div>
    </div>

    <div class="container">
        <h1 class="titulo">Menu Principal</h1>
        <div class="grid-menu">
            <a href="{{ url_for('conviventes') }}" class="card-menu">
                <h3>Conviventes</h3>
                <p>Cadastro e gestão de conviventes</p>
            </a>
            <a href="{{ url_for('carometro') }}" class="card-menu">
                <h3>Carômetro</h3>
                <p>Visualização e impressão de fotos</p>
            </a>
            <!-- ADICIONA SEUS OUTROS MENUS AQUI -->
        </div>
    </div>
</body>
</html>
