<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastrar Convivente - SISA</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: Arial, sans-serif; background: #f5f5f5; padding: 20px; }
     .container { max-width: 500px; margin: 0 auto; background: white; padding: 30px; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
        h1 { margin-bottom: 20px; color: #2e7d32; }
     .form-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; font-weight: bold; color: #333; }
        input[type="text"], input[type="file"], select {
            width: 100%;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 5px;
            font-size: 14px;
        }
     .btn {
            padding: 12px 24px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-weight: bold;
            font-size: 16px;
            margin-right: 10px;
        }
     .btn-salvar { background: #2e7d32; color: white; }
     .btn-cancelar { background: #ccc; color: #333; text-decoration: none; display: inline-block; }
    </style>
</head>
<body>
    <div class="container">
        <h1>Cadastrar Convivente</h1>
        <form method="POST" enctype="multipart/form-data">
            <div class="form-group">
                <label for="nome">Nome Completo:</label>
                <input type="text" id="nome" name="nome" required>
            </div>

            <div class="form-group">
                <label for="foto">Foto:</label>
                <input type="file" id="foto" name="foto" accept="image/*" onchange="preencherNome(this)">
            </div>

            <div class="form-group">
                <label for="leito_id">Leito:</label>
                <select id="leito_id" name="leito_id" required {% if leito_info %}disabled{% endif %}>
                    {% if leito_info %}
                        <option value="{{ leito_info['id'] }}" selected>Quarto {{ leito_info['quarto_numero'] }} - Leito {{ leito_info['numero_leito'] }}</option>
                    {% else %}
                        <option value="">Selecione um leito</option>
                        {% for leito in leitos_vazios %}
                        <option value="{{ leito['id'] }}">Quarto {{ leito['quarto_numero'] }} - Leito {{ leito['numero_leito'] }}</option>
                        {% endfor %}
                    {% endif %}
                </select>
                {% if leito_info %}
                <input type="hidden" name="leito_id" value="{{ leito_info['id'] }}">
                {% endif %}
            </div>

            <button type="submit" class="btn btn-salvar">Salvar</button>
            <a href="{{ url_for('mapa_leitos') }}" class="btn btn-cancelar">Cancelar</a>
        </form>
    </div>

    <script>
        // PUXA O NOME DO ARQUIVO E JOGA NO CAMPO NOME
        function preencherNome(input) {
            if (input.files && input.files[0]) {
                let nomeArquivo = input.files[0].name;
                // Remove a extensão.jpg,.jpeg,.png
                nomeArquivo = nomeArquivo.replace(/\.[^/.]+$/, "");
                // Troca _ por espaço e tira números no final
                nomeArquivo = nomeArquivo.replace(/[_]/g, " ").replace(/[0-9]+$/, "").trim();
                // Primeira letra maiúscula em cada palavra
                nomeArquivo = nomeArquivo.split(' ').map(palavra =>
                    palavra.charAt(0).toUpperCase() + palavra.slice(1).toLowerCase()
                ).join(' ');

                document.getElementById('nome').value = nomeArquivo;
            }
        }
    </script>
</body>
</html>
