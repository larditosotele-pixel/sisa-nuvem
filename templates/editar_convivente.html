<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Editar Convivente</title>
    <style>
        body { font-family: 'Segoe UI', Arial, sans-serif; background: #ecf0f1; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; }
    .form-box { background: white; padding: 40px; border-radius: 10px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); width: 450px; }
        h2 { margin-top: 0; color: #2c3e50; border-bottom: 2px solid #e67e22; padding-bottom: 10px; }
        label { display: block; margin: 15px 0 5px 0; font-weight: bold; color: #34495e; }
        input[type="text"] { width: 100%; padding: 10px; border: 1px solid #bdc3c7; border-radius: 5px; box-sizing: border-box; }
        input[type="file"] { width: 100%; padding: 10px; border: 2px dashed #e67e22; border-radius: 5px; background: #f8f9fa; cursor: pointer; }
    .btn { background: #e67e22; color: white; padding: 12px 20px; border: none; border-radius: 5px; cursor: pointer; width: 100%; margin-top: 20px; font-size: 16px; }
    .btn:hover { background: #d35400; }
    .btn-danger { background: #c0392b; margin-top: 10px; }
    .btn-danger:hover { background: #a93226; }
    .voltar { display: block; text-align: center; margin-top: 15px; color: #7f8c8d; text-decoration: none; }
    .foto-atual { width: 80px; height: 80px; border-radius: 8px; object-fit: cover; border: 3px solid #e67e22; margin-bottom: 10px; }
    .preview { margin-top: 10px; max-width: 100px; border-radius: 5px; display: none; }
    .dica { font-size: 12px; color: #7f8c8d; margin-top: 5px; }
    </style>
</head>
<body>
    <div class="form-box">
        <h2>Editando: {{ c.nome }}</h2>
        <form action="/atualizar_convivente/{{ c.id }}" method="POST" enctype="multipart/form-data">
            {% if c.foto %}
                <label>Foto Atual:</label>
                <img src="{{ url_for('static', filename=c.foto) }}" class="foto-atual">
            {% endif %}
            <label>Trocar Foto:</label>
            <input type="file" name="foto_file" id="foto_file" accept="image/*">
            <div class="dica">Deixe em branco para manter a atual.</div>
            <img id="preview" class="preview">
            <label>Nome do Convivente:</label>
            <input type="text" name="nome" id="nome" value="{{ c.nome }}" required>
            <label>Número do Quarto:</label>
            <input type="text" name="quarto" value="{{ c.quarto or '' }}" required>
            <label>Número do Leito:</label>
            <input type="text" name="leito" value="{{ c.leito or '' }}" required>
            <button type="submit" class="btn">Atualizar Dados</button>
        </form>

        <form action="/desocupar_leito/{{ c.id }}" method="POST" onsubmit="return confirm('Tem certeza? Isso vai limpar os dados e deixar o Leito {{ c.leito }} como VAGO.');">
    <button type="submit" class="btn btn-danger">Desocupar Leito</button>
</form>

        <a href="/" class="voltar">Cancelar e voltar</a>
    </div>
    <script>
        document.getElementById('foto_file').addEventListener('change', function(e) {
            const file = e.target.files[0];
            if (file) {
                let nomeArquivo = file.name.replace(/\.[^/.]+$/, "").replace(/[_-]/g, " ");
                nomeArquivo = nomeArquivo.split(' ').map(p => p.charAt(0).toUpperCase() + p.slice(1)).join(' ');
                document.getElementById('nome').value = nomeArquivo;
                const reader = new FileReader();
                reader.onload = function(e) {
                    const preview = document.getElementById('preview');
                    preview.src = e.target.result;
                    preview.style.display = 'block';
                }
                reader.readAsDataURL(file);
            }
        });
    </script>
</body>
</html>
