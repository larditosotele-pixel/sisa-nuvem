<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Novo Convivente</title>
    <style>
        body { font-family: Arial, sans-serif; max-width: 600px; margin: 30px auto; padding: 20px; }
        h2 { color: #1a2533; border-bottom: 2px solid #3498db; padding-bottom: 10px; }
        label { display: block; margin-top: 15px; font-weight: bold; color: #333; }
        input[type="text"], input[type="number"] { width: 100%; padding: 10px; margin-top: 5px; border: 1px solid #ddd; border-radius: 5px; box-sizing: border-box; }
        input[type="file"] { margin-top: 5px; }
        input[readonly] { background: #ecf0f1; }
      .info { font-size: 12px; color: #666; margin-top: 5px; }
      .preview { margin-top: 10px; max-width: 150px; border-radius: 5px; }
      .btn { background: #27ae60; color: white; padding: 12px 20px; border: none; border-radius: 5px; cursor: pointer; margin-top: 20px; font-size: 16px; width: 100%; }
      .btn:hover { background: #229954; }
      .voltar { background: #95a5a6; text-decoration: none; display: inline-block; text-align: center; }
      .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; }
    </style>
</head>
<body>
    <h2>{% if quarto_fixo %}Novo Leito no Quarto {{ quarto_fixo }}{% else %}Novo Quarto{% endif %}</h2>

    <form method="POST" enctype="multipart/form-data">
        <label>Foto do Convivente:</label>
        <input type="file" name="foto" id="foto" accept="image/*" required>
        <div class="info">Selecione uma foto. O nome do arquivo será usado como nome.</div>
        <img id="preview" class="preview" style="display:none;">

        <label>Nome do Convivente:</label>
        <input type="text" name="nome" id="nome" required>

        <div class="grid">
            <div>
                <label>Número do Quarto:</label>
                <input type="number" name="quarto" value="{{ proximo_quarto }}" {% if quarto_fixo %}readonly{% endif %} required>
                {% if not quarto_fixo %}<div class="info">Sugestão: próximo quarto vago</div>{% endif %}
            </div>
            <div>
                <label>Número do Leito:</label>
                <input type="number" name="leito" value="{{ proximo_leito }}" required>
                <div class="info">Sugestão: próximo leito vago</div>
            </div>
        </div>

        <button type="submit" class="btn">Salvar Convivente</button>
        <a href="/" class="btn voltar">Voltar</a>
    </form>

    <script>
        document.getElementById('foto').onchange = function(e) {
            const file = e.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = function(e) {
                    const img = document.getElementById('preview');
                    img.src = e.target.result;
                    img.style.display = 'block';
                }
                reader.readAsDataURL(file);
                let nomeArquivo = file.name.replace(/\.[^/.]+$/, "");
                nomeArquivo = nomeArquivo.replace(/_/g, ' ').replace(/\b\w/g, l => l.toUpperCase());
                document.getElementById('nome').value = nomeArquivo;
            }
        }
    </script>
</body>
</html>
