<!DOCTYPE html>
<html>
<head>
    <title>{{ titulo }}</title>
</head>
<body>
    <h1>{{ titulo }}</h1>
    <form method="POST" enctype="multipart/form-data">
        <label>Foto:</label><br>
        <input type="file" name="foto" id="foto" accept="image/*"><br><br>
        
        <label>Nome:</label><br>
        <input type="text" name="nome" id="nome" value="{{ convivente.nome if convivente else '' }}" required><br><br>
        
        <label>Quarto:</label><br>
        <input type="text" name="quarto" value="{{ convivente.quarto if convivente else '' }}"><br><br>
        
        <label>Leito:</label><br>
        <input type="text" name="leito" value="{{ convivente.leito if convivente else '' }}"><br><br>
        
        <label>Status:</label><br>
        <select name="status">
            <option value="Ativo" {% if convivente and convivente.status == 'Ativo' %}selected{% endif %}>Ativo</option>
            <option value="Inativo" {% if convivente and convivente.status == 'Inativo' %}selected{% endif %}>Inativo</option>
        </select><br><br>
        
        <button type="submit">Cadastrar</button>
    </form>

    <script>
    document.getElementById('foto').addEventListener('change', function(e) {
        let arquivo = e.target.files[0];
        if (arquivo) {
            let nomeArquivo = arquivo.name.split('.')[0];
            nomeArquivo = nomeArquivo.replace(/_/g, ' ').replace(/-/g, ' ');
            nomeArquivo = nomeArquivo.toLowerCase().split(' ').map(word => 
                word.charAt(0).toUpperCase() + word.slice(1)
            ).join(' ');
            document.getElementById('nome').value = nomeArquivo;
        }
    });
    </script>
</body>
</html>
