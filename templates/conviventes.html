<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro de Conviventes - SISA</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: Arial, sans-serif; background: #f0f0f0; font-size: 18px; }

.header {
            background: #1b5e20;
            color: white;
            padding: 16px;
            display: flex;
            align-items: center;
            gap: 12px;
        }
.header img { height: 50px; width: 50px; }
.header-text h1 { margin: 0; font-size: 24px; }
.header-text span { font-size: 16px; }

.container { max-width: 800px; margin: 16px auto; padding: 0 12px; }
.btn {
            width: 100%;
            background: #43a047;
            color: white;
            text-decoration: none;
            padding: 18px;
            border-radius: 8px;
            border: none;
            cursor: pointer;
            display: block;
            margin: 12px 0;
            font-size: 20px;
            min-height: 60px;
            font-weight: bold;
            text-align: center;
        }
.btn-voltar { background: #95a5a6; }
.btn-editar { background: #1976d2; }
.btn-excluir { background: #d32f2f; }
.flash { background: #c8e6c9; padding: 16px; border-radius: 8px; margin-bottom: 16px; font-size: 18px; text-align: center; }

        /* CARD SIMPLES - FUNCIONA EM QUALQUER CELULAR */
.card {
            background: white;
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 16px;
            box-shadow: 0 2px 6px rgba(0,0,0,0.1);
        }
.card-linha {
            display: flex;
            justify-content: space-between;
            margin: 12px 0;
            font-size: 19px;
            border-bottom: 1px solid #eee;
            padding-bottom: 12px;
        }
.card-linha:last-of-type { border-bottom: none; }
.card-linha strong { color: #1b5e20; font-size: 21px; }
.card-botoes {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            margin-top: 16px;
        }
.card-botoes.btn { margin: 0; }
    </style>
</head>
<body>
    <div class="header">
        <img src="{{ url_for('static', filename='logo_ki.png') }}" alt="Logo">
        <div class="header-text">
            <h1>SISA</h1>
            <span>CAE Idoso Lar Ditoso</span>
        </div>
    </div>

    <div class="container">
        <a href="{{ url_for('index') }}" class="btn btn-voltar">VOLTAR AO MENU</a>

        {% with messages = get_flashed_messages() %}
          {% if messages %}
            <div class="flash">{{ messages[0] }}</div>
          {% endif %}
        {% endwith %}

        <a href="{{ url_for('novo_convivente') }}" class="btn">+ NOVO CONVIVENTE</a>

        {% for c in conviventes %}
        <div class="card">
            <div class="card-linha">
                <span>NOME:</span>
                <strong>{{ c.nome }}</strong>
            </div>
            <div class="card-linha">
                <span>QUARTO:</span>
                <strong>{{ c.quarto }}</strong>
            </div>
            <div class="card-linha">
                <span>LEITO:</span>
                <strong>{{ c.leito }}</strong>
            </div>
            <div class="card-linha">
                <span>ID:</span>
                <strong>{{ c.id }}</strong>
            </div>

            <div class="card-botoes">
                <a href="{{ url_for('editar_convivente', id=c.id) }}" class="btn btn-editar">EDITAR</a>
                <a href="{{ url_for('excluir_convivente', id=c.id) }}" class="btn btn-excluir" onclick="return confirm('Excluir {{ c.nome }}?')">EXCLUIR</a>
            </div>
        </div>
        {% endfor %}
    </div>
</body>
</html>
