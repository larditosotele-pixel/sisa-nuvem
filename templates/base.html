<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}SISA{% endblock %}</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: Arial, sans-serif; background: #f0f0f0; font-size: 16px; }
    .header { background: #1b5e20; color: white; padding: 16px; display: flex; align-items: center; gap: 12px; }
    .header img { height: 45px; width: 45px; }
    .header-text h1 { margin: 0; font-size: 20px; }
    .header-text span { font-size: 14px; }
    .container { max-width: 1200px; margin: 16px auto; background: white; padding: 16px; border-radius: 8px; }
    .btn { background: #43a047; color: white; text-decoration: none; padding: 12px 18px; border-radius: 6px; border: none; cursor: pointer; display: inline-block; margin: 6px 0; font-size: 16px; min-height: 44px; }
    .btn-voltar { background: #95a5a6; }
        h2 { color: #1b5e20; margin-bottom: 16px; font-size: 22px; }
    .flash { background: #c8e6c9; padding: 12px; border-radius: 6px; margin-bottom: 16px; }
        input, select, textarea { width: 100%; padding: 12px; font-size: 16px; border: 1px solid #ddd; border-radius: 6px; margin: 6px 0; }
        label { font-size: 16px; font-weight: bold; color: #333; }
        @media (max-width: 768px) {.container { margin: 8px; padding: 12px; } }
    </style>
</head>
<body>
    <div class="header">
        <img src="{{ url_for('static', filename='logo_ki.png') }}" alt="Logo">
        <div class="header-text">
            <h1>SISA</h1>
            <span>CAE Idoso Lar Ditoso</span>
        </div>
    </div>
    <div class="container">
        {% block content %}{% endblock %}
    </div>
</body>
</html>
