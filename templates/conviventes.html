<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Gerenciar Conviventes</title>
    <style>
        body { font-family: Arial; background: #f0f0f0; margin: 0; }
       .header { background: #1b5e20; color: white; padding: 15px; text-align: center; }
       .container { max-width: 900px; margin: 20px auto; background: white; padding: 20px; border-radius: 8px; }
        table { width: 100%; border-collapse: collapse; }
        th { background: #1b5e20; color: white; padding: 12px; }
        td { padding: 10px; border-bottom: 1px solid #ddd; }
       .foto { width: 40px; height: 40px; border-radius: 50%; }
       .btn { padding: 6px 12px; margin: 2px; border-radius: 4px; text-decoration: none; color: white; }
       .btn-edit { background: #ff9800; }
       .btn-del { background: #c62828; }
       .btn-new { background: #2e7d32; display: inline-block; margin-bottom: 15px; padding: 10px 20px; }
    </style>
</head>
<body>
    <div class="header"><h1>Gerenciar Conviventes</h1></div>
    <div class="container">
        <a href="{{ url_for('cadastrar') }}" class="btn btn-new">+ Cadastrar Novo</a>
        <table>
            <tr><th>Foto</th><th>Nome</th><th>Status</th><th>Ações</th></tr>
            {% for c in conviventes %}
            <tr>
                <td>{% if c['foto'] %}<img src="{{ c['foto'] }}" class="foto">{% else %}👤{% endif %}</td>
                <td>{{ c['nome'] }}</td>
                <td>{{ c['status'] }}</td>
                <td>
                    <a href="{{ url_for('editar', id=c['id']) }}" class="btn btn-edit">Editar</a>
                    <a href="{{ url_for('excluir', id=c['id']) }}" class="btn btn-del" onclick="return confirm('Excluir?')">Excluir</a>
                </td>
            </tr>
            {% endfor %}
        </table>
        <br><a href="{{ url_for('index') }}">← Voltar ao Menu</a>
    </div>
</body>
</html>
